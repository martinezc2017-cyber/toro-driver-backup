workflows:

  # ── iOS App Store Build ────────────────────────────────────────────────────
  ios-release:
    name: TORO Driver — iOS App Store
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: 3.41.1
      xcode: latest
      cocoapods: default
      groups:
        - apple_credentials
      vars:
        BUNDLE_ID: com.tororide.driver
        APP_STORE_APP_ID: '6760872144'   # TORO Driver (App Store Connect) -> auto-incremento confiable del build number

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true

    scripts:
      - name: Fetch signing files
        script: |
          keychain initialize
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" | base64 --decode > /tmp/AuthKey.p8

          # Use stored cert key if available, otherwise generate and print for saving
          if [ -n "$CERT_PRIVATE_KEY" ]; then
            echo "$CERT_PRIVATE_KEY" | base64 --decode > /tmp/cert_key.pem
            echo "Using stored certificate private key"
          else
            openssl genrsa -out /tmp/cert_key.pem 2048
            echo "=== SAVE THIS KEY AS CERT_PRIVATE_KEY ENV VAR (base64) ==="
            base64 < /tmp/cert_key.pem | tr -d '\n'
            echo ""
            echo "=== END KEY ==="
          fi

          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key "$(cat /tmp/cert_key.pem)" \
            --private-key "$(cat /tmp/AuthKey.p8)" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID"
          keychain add-certificates

      - name: Get Flutter packages
        script: flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios && pod install --repo-update

      - name: Build number unico desde App Store Connect (fallback seguro)
        script: |
          # Toma el ultimo build number de ASC y suma 1 -> NUNCA duplicado.
          # Triple seguridad: usa $APP_STORE_APP_ID si esta seteado; si no, lo
          # resuelve por bundle id; y si CUALQUIER paso falla, NO setea
          # BUILD_NUMBER y el build usa el numero del pubspec (no se rompe).
          set +e
          APP_ID="$APP_STORE_APP_ID"
          if [ -z "$APP_ID" ]; then
            APP_ID=$(app-store-connect list-apps --bundle-id-identifier "$BUNDLE_ID" --json 2>/dev/null \
              | python3 -c "import sys,json;d=json.load(sys.stdin);print(d[0]['id'] if d else '')" 2>/dev/null)
          fi
          # El del pubspec es la segunda fuente: si va mas adelante (bump manual
          # tras un duplicado), manda el pubspec.
          PUB=$(grep -E '^version:' pubspec.yaml | sed -E 's/.*\+([0-9]+).*/\1/')
          echo "$PUB" | grep -qE '^[0-9]+$' || PUB=0
          MAX=0
          if [ -n "$APP_ID" ]; then
            # Comando MODERNO: MAX(TestFlight, App Store) en UNA llamada. Los viejos
            # (get-latest-testflight/app-store-build-number) devolvian vacio -> caia
            # al numero del pubspec ya subido y App Store Connect rechazaba el
            # duplicado ("attribute with a value that has already been used", #107).
            MAX_RAW=$(app-store-connect get-latest-build-number "$APP_ID" 2>&1)
            MAX=$(echo "$MAX_RAW" | grep -E '^[0-9]+$' | tail -1)
            [ -z "$MAX" ] && MAX=0
            [ "$MAX" -eq 0 ] && { echo "==> get-latest-build-number no dio numero. Salida:"; echo "$MAX_RAW"; }
          fi
          # Apple tarda en contar un build recien subido (sigue "processing"):
          # por eso se toma el MAYOR entre Apple+1 y el pubspec.
          NEXT=$((MAX + 1))
          [ "$PUB" -gt "$NEXT" ] && NEXT=$PUB
          echo "BUILD_NUMBER=$NEXT" >> "$CM_ENV"
          echo "==> Build number: $NEXT (ultimo en ASC=$MAX, pubspec=$PUB)"
          true

      - name: Apply profiles and build IPA
        script: |
          xcode-project use-profiles
          if [ -n "$BUILD_NUMBER" ]; then
            flutter build ipa --release --build-number=$BUILD_NUMBER \
              --export-options-plist=$HOME/export_options.plist
          else
            flutter build ipa --release \
              --export-options-plist=$HOME/export_options.plist
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
